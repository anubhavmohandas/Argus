# Push a tag v* (e.g. git tag v0.1.0 && git push origin v0.1.0) to:
#   1. build web/Dockerfile and push it to GHCR (fills the Packages box)
#   2. create a GitHub Release from the tag with auto-generated notes
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release
  packages: write   # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr owner must be lowercase; repo owner is already lowercase here
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
