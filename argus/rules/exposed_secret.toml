# A probe recovered a sensitive file AND its body carried a live-format credential
# (an AWS key, a private key, a provider token — matched by the 48-pattern catalog,
# stored redacted). This is the escalation of exposed_sensitive_file: not just "a
# .env is reachable" but "the reachable .env leaks a key". The secret's FORMAT is
# self-gating — ordinary page text cannot forge an AKIA… / -----BEGIN … KEY----- —
# so this stands on its own evidence. Highest base in the pack: a fetched file with
# a real-shaped secret is about as reportable as recon gets.
id = "exposed_secret"
name = "Secret leaked in exposed file"
description = "A publicly reachable host served a sensitive file whose contents contained a credential in a live provider format (redacted in Argus output). Rotate it before anything else."
base_confidence = 85
tags = ["exposure", "secret", "disclosure", "bug-bounty"]
version = 1

[requires]
exposed_secret = true
internet_facing = true

[outputs]
severity = "critical"
recommendation = [
    "Treat the leaked credential as compromised and rotate it immediately",
    "Remove the exposed file and block dotfiles/VCS metadata at the web server",
    "Audit access logs for use of the exposed credential",
]
hypothesis = ["A live credential is publicly readable — an attacker who fetched this file can authenticate as the service it belongs to"]
